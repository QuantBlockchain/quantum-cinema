name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd quantum-cinema
          npm ci

      - name: Lint frontend
        run: |
          cd quantum-cinema
          npm run lint

      - name: Build frontend
        run: |
          cd quantum-cinema
          npm run build

  infra:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install CDK dependencies
        run: npm ci

      - name: Synthesize CDK stack
        run: npx cdk synth
