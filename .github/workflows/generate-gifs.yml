name: Generate GIF previews

on:
  workflow_dispatch:

jobs:
  build-gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create gifs dir
        run: mkdir -p quantum-cinema/public/gifs

      - name: Generate GIFs (4s previews)
        run: |
          set -e
          for f in quantum-cinema/public/videos/*.mp4; do
            name=$(basename "$f" .mp4)
            out="quantum-cinema/public/gifs/${name}.gif"
            echo "Processing $f -> $out"
            ffmpeg -y -ss 0 -t 4 -i "$f" -vf "fps=15,scale=480:-1:flags=lanczos,palettegen" -y /tmp/palette.png
            ffmpeg -y -ss 0 -t 4 -i "$f" -i /tmp/palette.png -filter_complex "fps=15,scale=480:-1:flags=lanczos[x];[x][1:v]paletteuse" -y "$out"
          done

      - name: Commit and push GIFs
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add quantum-cinema/public/gifs || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: add generated GIF previews (4s)"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
